name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  workflow_dispatch:

env:
  PLUGIN_NAME: botology
  INTERNAL_NAME: botology
  RELEASE_DIR: botology\botology\bin\x64\Release\botology

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: botology
          submodules: recursive
          persist-credentials: false

      - name: Checkout AethertekUI
        uses: actions/checkout@v4
        with:
          repository: McVaxius/aethertekUI
          # Publish compatible library APIs before consumer changes.
          ref: a902c6714d9ea655dd41931f737390e2f1159b93
          path: aethertekUI
          # Repository-specific read-only SSH deploy key; no expiration.
          ssh-key: ${{ secrets.AETHERTEKUI_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"

      - name: Build
        working-directory: botology
        run: |
          $dalamudLibPath = "$env:AppData/XIVLauncher/addon/Hooks/dev"
          dotnet restore "botology/botology.csproj" -p:Configuration=Release -p:Platform=x64 -p:DalamudLibPath="$dalamudLibPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build "botology/botology.csproj" --configuration Release --no-restore -p:Platform=x64 -p:DalamudLibPath="$dalamudLibPath"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: |
            ${{ env.RELEASE_DIR }}\latest.zip
            ${{ env.RELEASE_DIR }}\${{ env.INTERNAL_NAME }}.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: artifact

      - name: Determine Release Version
        id: get_version
        shell: bash
        env:
          INTERNAL_NAME: ${{ env.INTERNAL_NAME }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            version="$(python3 -c "import json, os; from pathlib import Path; manifest_path = Path('artifact') / f\"{os.environ['INTERNAL_NAME']}.json\"; manifest = json.loads(manifest_path.read_text(encoding='utf-8')); manifest = manifest[0] if isinstance(manifest, list) else manifest; print(f\"v{manifest['AssemblyVersion']}\")")"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads((Path('artifact') / f"{os.environ['INTERNAL_NAME']}.json").read_text(encoding='utf-8-sig'))
          manifest = manifest[0] if isinstance(manifest, list) else manifest
          notes = re.split(r'\n(?=\d{4}-\d{2}-\d{2} - )', Path('CHANGELOG.md').read_text(encoding='utf-8-sig').strip(), maxsplit=1)[0].strip()
          if notes.splitlines()[0].split(' - ', 2)[1] != manifest['AssemblyVersion']:
              raise SystemExit('Changelog version does not match the packaged plugin')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"notes<<BOTOLOGY_RELEASE_NOTES\n{notes}\nBOTOLOGY_RELEASE_NOTES\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_version.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            artifact/latest.zip
            artifact/${{ env.INTERNAL_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
